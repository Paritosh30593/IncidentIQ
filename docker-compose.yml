services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: incidentiq-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: incidentiq-backend:latest
    container_name: incidentiq-backend
    build:
      context: ./Backend
      dockerfile: App/IC.WebAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__IC=Server=mssql;Database=IncidentIQDb;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True;Encrypt=False;
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: incidentiq-frontend:latest
    container_name: incidentiq-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
 