# ==============================================================================================
# |----- CD workflow for backend (.NET) & frontend (Node.js) projects. -----|
# ==============================================================================================
name: CD Development

# Additional GitHub Actions variables required by deploy-backend:
#   AZURE_SQL_SERVER: Azure SQL server hostname, without tcp: or port
#   AZURE_SQL_DATABASE: Azure SQL database name
#   API_BASE_URL: Backend API base URL embedded in the frontend bundle at build time
# AZURE_CLIENT_ID is used for both GitHub OIDC login and the backend SQL identity.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================================
  # Build and publish Backend (.NET) container image to Azure Container Registry (ACR)
  # ============================================================================================
  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login \
          --name "${{ vars.ACR_NAME }}" \
          --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
          --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_LOGIN_SERVER }}/incidentiq-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/App/IC.WebAPI/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================================
  # Build and publish Frontend (React/Vite) container image to Azure Container Registry (ACR)
  # ============================================================================================
  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login \
          --name "${{ vars.ACR_NAME }}" \
          --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
          --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_LOGIN_SERVER }}/incidentiq-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          file: Frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================================
  # Deploy the backend image and runtime SQL managed-identity configuration
  # ============================================================================================
  deploy-backend:
    name: Deploy Backend Container App
    needs: [backend]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend image and configure Azure SQL
        run: |
          az containerapp update \
            --name incidentiq-backend \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/incidentiq-backend:latest" \
            --set-env-vars \
              "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}" \
              "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" \
              "AzureSql__UseManagedIdentity=true" \
              "ConnectionStrings__IC=Server=tcp:${{ vars.AZURE_SQL_SERVER }},1433;Initial Catalog=${{ vars.AZURE_SQL_DATABASE }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;" \
              "CorsOrigins=${{ vars.FRONTEND_ORIGIN }}" \
              "AzureAd__TenantId=${{ vars.AZURE_TENANT_ID }}" \
              "AzureAd__ClientId=${{ vars.ENTRA_API_CLIENT_ID }}"

  # ============================================================================================
  # Deploy the frontend image to its Container App
  # ============================================================================================
  deploy-frontend:
    name: Deploy Frontend Container App
    needs: [frontend]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend image
        run: |
          az containerapp update \
            --name incidentiq-frontend \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/incidentiq-frontend:latest"

  # ============================================================================================
  # Deployment Summary
  # ============================================================================================
  summary:
    name: Deployment Summary
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Summary
        run: |
          echo "### Deployment Status 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** \`${{ vars.ACR_LOGIN_SERVER }}/incidentiq-backend:latest\` (deployed to Container App)" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image:** \`${{ vars.ACR_LOGIN_SERVER }}/incidentiq-frontend:latest\` (deployed to Container App)" >> $GITHUB_STEP_SUMMARY
          echo "Backend and frontend Container Apps updated." >> $GITHUB_STEP_SUMMARY
