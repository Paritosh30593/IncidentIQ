# ==============================================================================================
# |----- CD workflow for backend (.NET) & frontend (Node.js) projects. -----|
# ==============================================================================================
name: CD Development

# GitHub Actions variables (vars.*):
#   Shared:            AZURE_CLIENT_ID (GitHub OIDC login + backend SQL identity), AZURE_TENANT_ID,
#                      AZURE_SUBSCRIPTION_ID, ACR_NAME, ACR_RESOURCE_GROUP, ACR_LOGIN_SERVER
#   migrate-database:  AZURE_MIGRATION_CLIENT_ID (migration identity, pd-az-sql-migrate-westus-02),
#                      AZURE_SQL_SERVER (hostname, without tcp: or port), AZURE_SQL_DATABASE
#                      The SQL server is expected in ACR_RESOURCE_GROUP.
#                      See docs/database-migrations.md for the one-time identity/SQL setup.
#   deploy-backend:    AZURE_SQL_SERVER, AZURE_SQL_DATABASE, FRONTEND_ORIGIN, ENTRA_API_CLIENT_ID
#                      Also reuses AZURE_SQL_SERVER/AZURE_SQL_DATABASE/AZURE_CLIENT_ID to build the
#                      Serilog MSSqlServer sink connection string (Authentication=Active Directory
#                      Managed Identity), since that sink opens its own SqlConnection directly from
#                      config rather than going through the app's connection-string-builder code.
#   frontend build:    API_BASE_URL - leave unset/empty. The backend is internal-only, so the frontend
#                      calls same-origin /api/* paths, which nginx.conf proxies internally to
#                      incidentiq-backend. Only set this if the backend is ever made externally
#                      reachable again.
#                      ENTRA_SPA_CLIENT_ID (frontend/SPA app registration, distinct from the shared
#                      AZURE_CLIENT_ID). Reuses ENTRA_API_CLIENT_ID, FRONTEND_ORIGIN for MSAL
#                      scope/redirect config. MSAL authority is hardcoded to /common/v2.0 in
#                      authConfig.ts (login open to any tenant/personal account; API access still
#                      restricted to our tenant by the single-tenant backend App Registration).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/incidentiq-backend
  FRONTEND_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/incidentiq-frontend

jobs:
  # ============================================================================================
  # Build and publish Backend (.NET) container image to Azure Container Registry (ACR)
  # ============================================================================================
  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login \
            --name "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/App/IC.WebAPI/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================================
  # Build and publish Frontend (React/Vite) container image to Azure Container Registry (ACR)
  # ============================================================================================
  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login \
            --name "${{ vars.ACR_NAME }}" \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          file: Frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Left empty, VITE_API_BASE_URL makes httpClient use same-origin /api/ requests,
          # which nginx.conf proxies to the internal-only backend Container App.
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
            VITE_AZURE_CLIENT_ID=${{ vars.ENTRA_SPA_CLIENT_ID }}
            VITE_AZURE_AUTH_APP_ID=${{ vars.ENTRA_API_CLIENT_ID }}
            VITE_AZURE_HOST=${{ vars.FRONTEND_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================================
  # Apply pending EF Core migrations to Azure SQL (runs before the new backend is deployed)
  # Uses a dedicated migration identity (DDL rights); the app identity keeps data-only rights.
  # ============================================================================================
  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # Never run two migrations at the same time, and never cancel one midway.
    concurrency:
      group: db-migrate
      cancel-in-progress: false

    env:
      SQL_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
      SQL_SERVER_FQDN: ${{ vars.AZURE_SQL_SERVER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and build
        working-directory: Backend
        run: |
          dotnet tool restore
          dotnet build App/IC.WebAPI/IC.WebAPI.csproj --configuration Release

      - name: Log in to Azure (migration identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Allow runner IP on SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          SQL_SERVER_NAME="${SQL_SERVER_FQDN%%.*}"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "SQL_SERVER_NAME=$SQL_SERVER_NAME" >> "$GITHUB_ENV"
          az sql server firewall-rule create \
            --resource-group "$SQL_RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "gha-migrate-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

      # Applies only pending migrations (tracked in __EFMigrationsHistory); no-op when up to date.
      # "Active Directory Default" picks up the Azure CLI login of the migration identity.
      # Serverless Azure SQL auto-pauses; the first connection wakes it and fails with
      # "database is not currently available". Retry until it is online (resume takes ~1 min).
      - name: Apply EF Core migrations to Azure SQL
        working-directory: Backend
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if dotnet ef database update \
              --project App/IC.Infrastructure \
              --startup-project App/IC.WebAPI \
              --configuration Release --no-build \
              --connection "Server=tcp:$SQL_SERVER_FQDN,1433;Initial Catalog=${{ vars.AZURE_SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=120;" \
              2>&1 | tee "$RUNNER_TEMP/ef.log"; then
              exit 0
            fi
            if ! grep -q "is not currently available" "$RUNNER_TEMP/ef.log"; then
              echo "Migration failed for a reason other than a paused database."; exit 1
            fi
            echo "Database is resuming, retrying in 30s (attempt $attempt/6)..."
            sleep 30
          done
          echo "Database did not come online in time."; exit 1

      # Always remove the temporary firewall rule, even if the migration failed
      - name: Remove runner IP from SQL firewall
        if: always() && env.RUNNER_IP != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "$SQL_RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "gha-migrate-${{ github.run_id }}" || true

  # ============================================================================================
  # Deploy the backend image and runtime SQL managed-identity configuration
  # ============================================================================================
  deploy-backend:
    name: Deploy Backend Container App
    needs: [backend, migrate-database]
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend image and configure Azure SQL
        # Serilog__WriteTo__1__Args__connectionString targets WriteTo[1] (MSSqlServer) in
        # appsettings.json by array index - keep this in sync if that array's order changes.
        # Unlike ConnectionStrings__IC, the auth mode is embedded directly in the string because
        # the Serilog sink opens its own SqlConnection from config, bypassing ServiceExtensions.cs's
        # connection-string-builder code that adds Managed Identity auth for EF/Dapper.
        run: |
          az containerapp update \
            --name incidentiq-backend \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "$BACKEND_IMAGE:latest" \
            --set-env-vars \
              "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}" \
              "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" \
              "AzureSql__UseManagedIdentity=true" \
              "ConnectionStrings__IC=Server=tcp:${{ vars.AZURE_SQL_SERVER }},1433;Initial Catalog=${{ vars.AZURE_SQL_DATABASE }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;" \
              "CorsOrigins=${{ vars.FRONTEND_ORIGIN }}" \
              "AzureAd__TenantId=${{ vars.AZURE_TENANT_ID }}" \
              "AzureAd__ClientId=${{ vars.ENTRA_API_CLIENT_ID }}" \
              "Serilog__WriteTo__1__Args__connectionString=Server=tcp:${{ vars.AZURE_SQL_SERVER }},1433;Initial Catalog=${{ vars.AZURE_SQL_DATABASE }};Authentication=Active Directory Managed Identity;User Id=${{ vars.AZURE_CLIENT_ID }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

  # ============================================================================================
  # Deploy the frontend image to its Container App
  # ============================================================================================
  deploy-frontend:
    name: Deploy Frontend Container App
    needs: [frontend]
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend image
        run: |
          az containerapp update \
            --name incidentiq-frontend \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "$FRONTEND_IMAGE:latest"

  # ============================================================================================
  # Deployment Summary
  # ============================================================================================
  summary:
    name: Deployment Summary
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Summary
        run: |
          {
            echo "### Deployment Status 🚀"
            echo "**Backend Image:** \`$BACKEND_IMAGE:latest\` (deployed to Container App)"
            echo "**Frontend Image:** \`$FRONTEND_IMAGE:latest\` (deployed to Container App)"
            echo "Backend and frontend Container Apps updated."
          } >> "$GITHUB_STEP_SUMMARY"
