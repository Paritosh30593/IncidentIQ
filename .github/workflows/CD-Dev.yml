# ==============================================================================================
# |----- CD workflow for backend (.NET) & frontend (Node.js) projects. -----|
# ==============================================================================================
name: CD Development

# Additional GitHub Actions variables required by deploy-backend:
#   AZURE_SQL_SERVER: Azure SQL server hostname, without tcp: or port
#   AZURE_SQL_DATABASE: Azure SQL database name
#   API_BASE_URL: Backend API base URL embedded in the frontend bundle at build time
#   AZURE_SQL_RESOURCE_GROUP (optional): resource group of the SQL server, defaults to ACR_RESOURCE_GROUP
# Additional variable required by migrate-database:
#   AZURE_MIGRATION_CLIENT_ID: client ID of the migration identity (pd-az-sql-migrate-westus-02)
# See docs/database-migrations.md for the one-time identity/SQL setup.
# AZURE_CLIENT_ID is used for both GitHub OIDC login and the backend SQL identity.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================================
  # Build and publish Backend (.NET) container image to Azure Container Registry (ACR)
  # ============================================================================================
  backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login \
          --name "${{ vars.ACR_NAME }}" \
          --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
          --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_LOGIN_SERVER }}/incidentiq-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/App/IC.WebAPI/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================================
  # Build and publish Frontend (React/Vite) container image to Azure Container Registry (ACR)
  # ============================================================================================
  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login \
          --name "${{ vars.ACR_NAME }}" \
          --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
          --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_LOGIN_SERVER }}/incidentiq-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          file: Frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================================
  # Apply pending EF Core migrations to Azure SQL (runs before the new backend is deployed)
  # Uses a dedicated migration identity (DDL rights); the app identity keeps data-only rights.
  # ============================================================================================
  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # Never run two migrations at the same time, and never cancel one midway.
    concurrency:
      group: db-migrate
      cancel-in-progress: false

    env:
      SQL_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
      SQL_FQDN: ${{ vars.AZURE_SQL_SERVER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build migrations
        working-directory: Backend
        run: |
          dotnet tool restore
          dotnet build App/IC.WebAPI/IC.WebAPI.csproj --configuration Release

      - name: Log in to Azure (migration identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Allow runner IP on SQL firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "SQL_SERVER_NAME=${SQL_FQDN%%.*}" >> "$GITHUB_ENV"
          az sql server firewall-rule create \
            --resource-group "$SQL_RESOURCE_GROUP" \
            --server "${SQL_FQDN%%.*}" \
            --name "gha-migrate-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

      # Applies only pending migrations (tracked in __EFMigrationsHistory); no-op when up to date.
      # "Active Directory Default" picks up the Azure CLI login of the migration identity.
      # Serverless Azure SQL auto-pauses; the first connection wakes it and fails with
      # "database is not currently available". Retry until it is online (resume takes ~1 min).
      - name: Apply EF Core migrations to Azure SQL
        working-directory: Backend
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if dotnet ef database update \
              --project App/IC.Infrastructure \
              --startup-project App/IC.WebAPI \
              --configuration Release --no-build \
              --connection "Server=tcp:${{ vars.AZURE_SQL_SERVER }},1433;Initial Catalog=${{ vars.AZURE_SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=120;" \
              2>&1 | tee "$RUNNER_TEMP/ef.log"; then
              exit 0
            fi
            if ! grep -q "is not currently available" "$RUNNER_TEMP/ef.log"; then
              echo "Migration failed for a reason other than a paused database."; exit 1
            fi
            echo "Database is resuming, retrying in 30s (attempt $attempt/6)..."
            sleep 30
          done
          echo "Database did not come online in time."; exit 1

      # Always remove the temporary firewall rule, even if the migration failed
      - name: Remove runner IP from SQL firewall
        if: always() && env.RUNNER_IP != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "$SQL_RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "gha-migrate-${{ github.run_id }}" || true

  # ============================================================================================
  # Deploy the backend image and runtime SQL managed-identity configuration
  # ============================================================================================
  deploy-backend:
    name: Deploy Backend Container App
    needs: [backend, migrate-database]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend image and configure Azure SQL
        run: |
          az containerapp update \
            --name incidentiq-backend \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/incidentiq-backend:latest" \
            --set-env-vars \
              "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}" \
              "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" \
              "AzureSql__UseManagedIdentity=true" \
              "ConnectionStrings__IC=Server=tcp:${{ vars.AZURE_SQL_SERVER }},1433;Initial Catalog=${{ vars.AZURE_SQL_DATABASE }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;" \
              "CorsOrigins=${{ vars.FRONTEND_ORIGIN }}" \
              "AzureAd__TenantId=${{ vars.AZURE_TENANT_ID }}" \
              "AzureAd__ClientId=${{ vars.ENTRA_API_CLIENT_ID }}"

  # ============================================================================================
  # Deploy the frontend image to its Container App
  # ============================================================================================
  deploy-frontend:
    name: Deploy Frontend Container App
    needs: [frontend]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend image
        run: |
          az containerapp update \
            --name incidentiq-frontend \
            --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/incidentiq-frontend:latest"

  # ============================================================================================
  # Deployment Summary
  # ============================================================================================
  summary:
    name: Deployment Summary
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Summary
        run: |
          echo "### Deployment Status 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** \`${{ vars.ACR_LOGIN_SERVER }}/incidentiq-backend:latest\` (deployed to Container App)" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image:** \`${{ vars.ACR_LOGIN_SERVER }}/incidentiq-frontend:latest\` (deployed to Container App)" >> $GITHUB_STEP_SUMMARY
          echo "Backend and frontend Container Apps updated." >> $GITHUB_STEP_SUMMARY
