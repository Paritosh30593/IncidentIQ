server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied server-side so the backend Container App can stay internal-only;
    # the browser never talks to it directly.
    location /api/ {
        # Container Apps internal ingress terminates TLS and routes by SNI/Host on a
        # shared IP, so this must be https:// with SNI passed through (off by default)
        # and the Host header left as the backend's own name, not the frontend's.
        proxy_pass https://incidentiq-backend.internal.mangobush-22ec1399.westus2.azurecontainerapps.io/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host incidentiq-backend.internal.mangobush-22ec1399.westus2.azurecontainerapps.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}