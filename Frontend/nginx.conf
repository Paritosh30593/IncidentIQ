server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied server-side so the backend Container App can stay internal-only;
    # the browser never talks to it directly.
    location /api/ {
        proxy_pass http://incidentiq-backend.internal.mangobush-22ec1399.westus2.azurecontainerapps.io/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}