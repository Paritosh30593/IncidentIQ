server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied server-side so the backend Container App can stay internal-only.
    # incidentiq-env has no VNet integration, so the .internal.<domain> FQDN
    # routes through the same public edge and gets rejected there; the app
    # name (Container Apps' built-in sibling DNS) is required instead.
    location /api/ {
        proxy_http_version 1.1; # nginx defaults to 1.0, which Azure's ingress rejects (426)
        proxy_pass http://incidentiq-backend/api/;
        proxy_set_header Host incidentiq-backend; # must match the target app, not $host
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}