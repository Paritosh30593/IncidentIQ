server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied server-side so the backend Container App can stay internal-only;
    # the browser never talks to it directly. incidentiq-env has no VNet
    # integration, so the .internal.<domain> FQDN still routes through the
    # shared public ingress IP, which always rejects internal-only apps there.
    # Sibling apps must instead use Container Apps' built-in DNS service
    # discovery (plain app name), which resolves internally and bypasses
    # that edge entirely.
    location /api/ {
        # nginx defaults to HTTP/1.0 for proxied upstream connections, which
        # Azure's internal ingress rejects with 426 Upgrade Required.
        proxy_http_version 1.1;
        proxy_pass http://incidentiq-backend/api/;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}