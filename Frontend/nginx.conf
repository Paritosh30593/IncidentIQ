server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # BACKEND_URL must not end with a slash, or the /api prefix is stripped.
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}